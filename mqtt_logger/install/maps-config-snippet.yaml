# The MAPS Value Logger needs messages delivered as Message-JSON envelopes.
#
# No server configuration is required for that: the logger appends
# "?Transformation=Message-JSON" to its MQTT client id and MAPS applies the
# transformation to that connection only.
#
# Do NOT add a host-wide rule such as
#
#   - pattern: "tcp://127.0.0.1/*/*"
#     transformation: "Message-JSON"
#
# It converts traffic for EVERY local MQTT client (web viewers behind a local
# reverse proxy, bridges, tools) into envelopes and breaks them.
#
# If the server should enforce the transformation, scope the rule to the
# logger's account instead. Patterns are transport://host/protocol/username:

transformations:
  data:
    - pattern: "*://*/*/*"
      transformation: ""

    - pattern: "*://127.0.0.1/mqtt/maps-logger"
      transformation: "Message-JSON"
